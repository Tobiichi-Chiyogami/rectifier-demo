<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全桥整流电路仿真器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1e1e2e; color: #cdd6f4; padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 16px; color: #89b4fa; }
  .container { display: flex; gap: 20px; flex-wrap: wrap; }
  .left { flex: 1 1 520px; }
  .right { flex: 0 0 280px; }
  .panel {
    background: #313244; border-radius: 10px; padding: 16px;
    margin-bottom: 16px;
  }
  canvas { width: 100%; border-radius: 8px; background: #181825; display: block; }
  .param { margin-bottom: 14px; }
  .param label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .param .val { color: #a6e3a1; font-weight: 600; }
  .param input[type=range] {
    width: 100%; accent-color: #89b4fa;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .stats { font-size: 13px; line-height: 1.9; }
  .stats span { color: #f9e2af; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>

<h1>⚡ 全桥整流电路仿真器</h1>

<div class="container">
  <div class="left">
    <div class="panel">
      <canvas id="circuit" width="760" height="320"></canvas>
    </div>
    <div class="panel">
      <canvas id="wave" width="760" height="260"></canvas>
      <div class="legend">
        <span><i style="background:#f38ba8"></i>输入交流</span>
        <span><i style="background:#fab387"></i>整流后（脉动）</span>
        <span><i style="background:#a6e3a1"></i>电容滤波后</span>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="param">
        <label>输入电压幅值 Vm <span class="val" id="vmVal">12 V</span></label>
        <input type="range" id="vm" min="1" max="30" step="0.5" value="12">
      </div>
      <div class="param">
        <label>输入频率 f <span class="val" id="fVal">50 Hz</span></label>
        <input type="range" id="f" min="10" max="120" step="1" value="50">
      </div>
      <div class="param">
        <label>负载电阻 R <span class="val" id="rVal">100 Ω</span></label>
        <input type="range" id="rSlider" min="10" max="1000" step="10" value="100">
      </div>
      <div class="param">
        <label>滤波电容 C <span class="val" id="cVal">470 μF</span></label>
        <input type="range" id="c" min="0" max="2000" step="10" value="470">
      </div>
    </div>

    <div class="panel stats">
      <div>输出平均电压：<span id="vavg">—</span></div>
      <div>纹波峰峰值：<span id="vpp">—</span></div>
      <div>纹波系数：<span id="ripple">—</span></div>
    </div>
  </div>
</div>

<script>
// ====== 参数 ======
const params = { Vm: 12, f: 50, R: 100, C: 470e-6 };
const Vd = 0.7;
const CYCLES = 6;
const STEPS_PER_CYCLE = 400;

// ====== 仿真核心 ======
function simulate() {
  const { Vm, f, R, C } = params;
  const T = 1 / f;
  const totalT = CYCLES * T;
  const dt = T / STEPS_PER_CYCLE;
  const N = Math.floor(totalT / dt);

  const tArr = [], vinArr = [], vrectArr = [], voutArr = [];
  let Vc = 0;

  for (let i = 0; i < N; i++) {
    const t = i * dt;
    const vin = Vm * Math.sin(2 * Math.PI * f * t);
    const vabs = Math.abs(vin);
    let vrect;

    if (C <= 0) {
      vrect = Math.max(vabs - 2 * Vd, 0);
      Vc = vrect;
    } else {
      if (vabs > Vc + 2 * Vd) {
        Vc = vabs - 2 * Vd;
      } else {
        Vc = Vc * Math.exp(-dt / (R * C));
      }
      vrect = Math.max(vabs - 2 * Vd, 0);
    }

    tArr.push(t);
    vinArr.push(vin);
    vrectArr.push(vrect);
    voutArr.push(Vc);
  }

  const startIdx = Math.floor(N * (CYCLES - 2) / CYCLES);
  let sum = 0, max = -Infinity, min = Infinity;
  for (let i = startIdx; i < N; i++) {
    sum += voutArr[i];
    if (voutArr[i] > max) max = voutArr[i];
    if (voutArr[i] < min) min = voutArr[i];
  }
  const vavg = sum / (N - startIdx);
  const vpp = max - min;

  return { tArr, vinArr, vrectArr, voutArr, vavg, vpp, totalT, Vm };
}

// ====== 绘制电路图（菱形全桥，紧凑版）======
function drawCircuit(ctx, conducting) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = "center";

  const wireColor   = "#6c7086";
  const sourceColor = "#f38ba8";
  const bridgeColor = "#89b4fa";
  const diodeOn     = "#a6e3a1";
  const diodeOff    = "#7f849c";
  const capColor    = "#a6e3a1";
  const resColor    = "#f9e2af";
  const dimColor    = "#9399b2";

  const cy = H / 2;

  // ---------- 布局（紧凑）----------
  const acX = 80, acY = cy;

  const bridgeCX = 300;
  const bridgeCY = cy;
  const Rr = 70;   // 菱形半径（比之前略小）

  const top    = { x: bridgeCX,     y: bridgeCY - Rr };
  const bottom = { x: bridgeCX,     y: bridgeCY + Rr };
  const left   = { x: bridgeCX - Rr, y: bridgeCY };
  const right  = { x: bridgeCX + Rr, y: bridgeCY };

  const mTL = { x: (top.x + left.x) / 2,  y: (top.y + left.y) / 2 };
  const mTR = { x: (top.x + right.x) / 2, y: (top.y + right.y) / 2 };
  const mBL = { x: (bottom.x + left.x) / 2,  y: (bottom.y + left.y) / 2 };
  const mBR = { x: (bottom.x + right.x) / 2, y: (bottom.y + right.y) / 2 };

  // 输出母线：离菱形上下角只有 40px
  const outTopY = top.y - 40;
  const outBotY = bottom.y + 40;
  const capMidY = (outTopY + outBotY) / 2;

  const capX = 480;
  const resX = 640;

  // AC 下方绕行线的 y 坐标：放在下母线稍下方，但不出画布
  const acLowerY = outBotY + 20;

  // ---------- AC 源 ----------
  ctx.strokeStyle = sourceColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(acX, acY, 26, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  for (let i = -12; i <= 12; i++) {
    const x = acX + i;
    const y = acY - Math.sin(i / 12 * Math.PI) * 8;
    i === -12 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = sourceColor;
  ctx.font = "600 13px sans-serif";
  ctx.fillText("AC", acX, acY + 46);
  ctx.fillStyle = dimColor;
  ctx.font = "12px sans-serif";
  ctx.fillText(`${params.Vm}V / ${params.f}Hz`, acX, acY + 64);

  // ---------- 菱形四条边 ----------
  ctx.strokeStyle = bridgeColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);       ctx.lineTo(right.x, right.y);
  ctx.lineTo(bottom.x, bottom.y); ctx.lineTo(left.x, left.y);
  ctx.closePath();
  ctx.stroke();

  // ---------- 二极管符号 ----------
  const drawDiode = (x, y, angle, on) => {
    const s = 10;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const col = on ? diodeOn : diodeOff;

    ctx.beginPath();
    ctx.moveTo(-s, -s);
    ctx.lineTo(-s,  s);
    ctx.lineTo( s,  0);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(s, -s);
    ctx.lineTo(s,  s);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = col;
    ctx.stroke();

    ctx.restore();
  };

  // 左上边、右上边、左下边、右下边
  drawDiode(mTL.x, mTL.y, -Math.PI / 4,     conducting);
  drawDiode(mTR.x, mTR.y, -3 * Math.PI / 4, conducting);
  drawDiode(mBL.x, mBL.y, -Math.PI / 4,     conducting);
  drawDiode(mBR.x, mBR.y, -3 * Math.PI / 4, conducting);

  // 菱形四个角圆点
  ctx.fillStyle = bridgeColor;
  [top, bottom, left, right].forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 桥标签
  ctx.fillStyle = bridgeColor;
  ctx.font = "600 13px sans-serif";
  ctx.fillText("全桥整流 D1~D4", bridgeCX, bottom.y + 25);

  // ---------- AC → 菱形左边角 ----------
  ctx.strokeStyle = wireColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(acX + 26, acY);
  ctx.lineTo(left.x, left.y);
  ctx.stroke();

  // AC → 菱形右边角（从 AC 底端出发，走下方绕行，抬高一些不出画布）
  ctx.beginPath();
  ctx.moveTo(acX, acY + 26);
  ctx.lineTo(acX, acLowerY);
  ctx.lineTo(right.x, acLowerY);
  ctx.lineTo(right.x, right.y);
  ctx.stroke();

  // ---------- 菱形上角 → 上母线 ----------
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);
  ctx.lineTo(top.x, outTopY);
  ctx.lineTo(resX, outTopY);
  ctx.stroke();

  // ---------- 菱形下角 → 下母线 ----------
  ctx.beginPath();
  ctx.moveTo(bottom.x, bottom.y);
  ctx.lineTo(bottom.x, outBotY);
  ctx.lineTo(resX, outBotY);
  ctx.stroke();

  // ---------- 滤波电容 ----------
  ctx.strokeStyle = wireColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(capX, outTopY);
  ctx.lineTo(capX, capMidY - 8);
  ctx.moveTo(capX, capMidY + 8);
  ctx.lineTo(capX, outBotY);
  ctx.stroke();

  ctx.strokeStyle = capColor;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(capX - 22, capMidY - 8);
  ctx.lineTo(capX + 22, capMidY - 8);
  ctx.moveTo(capX - 22, capMidY + 8);
  ctx.lineTo(capX + 22, capMidY + 8);
  ctx.stroke();

  ctx.fillStyle = capColor;
  ctx.font = "600 13px sans-serif";
  ctx.fillText(`C=${(params.C*1e6).toFixed(0)}μF`, capX, outBotY + 20);

  // ---------- 负载电阻 ----------
  ctx.strokeStyle = wireColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(resX, outTopY);
  ctx.lineTo(resX, capMidY - 28);
  ctx.moveTo(resX, capMidY + 28);
  ctx.lineTo(resX, outBotY);
  ctx.stroke();

  ctx.fillStyle = resColor;
  ctx.fillRect(resX - 13, capMidY - 28, 26, 56);

  ctx.fillStyle = resColor;
  ctx.font = "600 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`R=${params.R}Ω`, resX + 22, capMidY + 5);
  ctx.textAlign = "center";
}

// ====== 绘制波形 ======
function drawWave(ctx, data) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const pad = { l: 50, r: 20, t: 20, b: 30 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;
  ctx.clearRect(0, 0, W, H);

  const yMax = data.Vm * 1.15;
  const yMin = -yMax;
  const totalT = data.totalT;

  const xToPx = t => pad.l + (t / totalT) * plotW;
  const yToPx = v => pad.t + (yMax - v) / (yMax - yMin) * plotH;

  ctx.strokeStyle = "#313244";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + i * plotH / 4;
    ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y);
  }
  for (let i = 0; i <= 6; i++) {
    const x = pad.l + i * plotW / 6;
    ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b);
  }
  ctx.stroke();

  const y0 = yToPx(0);
  ctx.strokeStyle = "#585b70";
  ctx.beginPath();
  ctx.moveTo(pad.l, y0); ctx.lineTo(W - pad.r, y0);
  ctx.stroke();

  ctx.fillStyle = "#9399b2";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`+${yMax.toFixed(1)}V`, pad.l - 6, pad.t + 10);
  ctx.fillText("0V", pad.l - 6, y0 + 4);
  ctx.fillText(`-${yMax.toFixed(1)}V`, pad.l - 6, H - pad.b);
  ctx.textAlign = "center";
  ctx.fillText("时间 (ms)", W / 2, H - 8);
  ctx.textAlign = "left";
  ctx.fillText("0", pad.l, H - pad.b + 14);
  ctx.fillText((totalT * 1000).toFixed(1), W - pad.r - 20, H - pad.b + 14);

  const drawLine = (arr, color, width, dashed=false) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dashed ? [5,4] : []);
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = xToPx(data.tArr[i]);
      const y = yToPx(arr[i]);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  };

  drawLine(data.vinArr,   "#f38ba8", 1.5, true);
  drawLine(data.vrectArr, "#fab387", 1.5);
  drawLine(data.voutArr,  "#a6e3a1", 2.5);
}

// ====== 主更新 ======
function update() {
  const data = simulate();

  drawCircuit(document.getElementById("circuit").getContext("2d"), false);
  drawWave(document.getElementById("wave").getContext("2d"), data);

  const vavg = data.vavg;
  const vpp = data.vpp;
  const ripple = vavg > 0.01 ? (vpp / vavg) : 0;
  document.getElementById("vavg").textContent = vavg.toFixed(2) + " V";
  document.getElementById("vpp").textContent = vpp.toFixed(3) + " V";
  document.getElementById("ripple").textContent = (ripple * 100).toFixed(2) + " %";
}

// ====== 绑定滑块 ======
function bindSlider(sliderId, labelId, key, fmt, scale = 1) {
  const el = document.getElementById(sliderId);
  const label = document.getElementById(labelId);

  const apply = () => {
    params[key] = parseFloat(el.value) * scale;
    if (label) label.textContent = fmt(params[key]);
    update();
  };

  el.addEventListener("input", apply);
  el.addEventListener("change", apply);
  apply();
}

bindSlider("vm",      "vmVal", "Vm", v => v.toFixed(1) + " V");
bindSlider("f",       "fVal",  "f",  v => v.toFixed(0) + " Hz");
bindSlider("rSlider", "rVal",  "R",  v => v.toFixed(0) + " Ω");
bindSlider("c",       "cVal",  "C",  v => (v * 1e6).toFixed(0) + " μF", 1e-6);

update();
</script>
</body>
</html>
